<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen · Photo Orders</title><link rel="stylesheet" href="staff-orders.css"><link rel="stylesheet" href="photo-flow.css"><script src="firebase-config.js"></script><script src="flow-v2/receipt-parser.js?v=fetch-fix-1"></script><script src="ai-config.js?v=fetch-fix-1"></script><script src="ai-client.js?v=fetch-fix-1" defer></script><script src="photo-flow.js?v=fetch-fix-1" defer></script></head><body data-mode="kitchen"><header class="top"><strong>Radisson · Kitchen</strong><a href="hostess.html">← ส่งรูปบิล</a><button id="aiSetup" type="button">ตั้งค่า AI</button></header><main><section class="intro"><div><p class="eyebrow">LIVE KITCHEN BOARD</p><h1>กระดานครัว</h1><p>แตะเมนูเมื่อทำครบตามจำนวน • แตะซ้ำเพื่อยกเลิกเครื่องหมาย</p></div><button id="sound">เปิดเสียง</button></section><p id="connection" role="status">กำลังเชื่อมต่อ…</p><input id="search" type="search" aria-label="ค้นหา" placeholder="ค้นหาโต๊ะ เลขบิล เมนู"><div class="compact-board-label"><strong>ออเดอร์ที่กำลังทำ</strong><span id="boardCount">0 บิล</span><span>บิลที่รอนานอยู่ก่อน</span></div><div id="board" class="board"></div></main><dialog id="picture"><button id="closePicture">ปิด ✕</button><img id="billImage" class="receipt" alt="บิลต้นฉบับ"></dialog><div id="toast" class="toast" role="status" hidden></div><dialog id="aiSettings"><form id="aiSettingsForm"><div class="dialog-head"><h2>เชื่อม AI อ่านบิล</h2></div><label>Worker URL<input id="aiEndpoint" type="url" required placeholder="https://kitchen-bill-reader.…workers.dev"></label><p class="meta">ผู้ดูแลตั้ง Worker URL เพียงครั้งเดียวในเครื่องนี้ พนักงานกดอัปโหลดได้เลย</p><p id="aiSettingsError" class="error" role="alert"></p><button class="primary">บันทึก</button> <button id="aiCancel" type="button">ยกเลิก</button></form></dialog></body></html>
