<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Scan &amp; Dine | Radisson Resort Layan Phuket</title>
<meta content="#249db2" name="theme-color"/>
<meta content="Enter your room number to open the in-room dining menu at Radisson Resort Layan Phuket." name="description"/>
<link href="gateway.css" rel="stylesheet"/>
</head>
<body>
<main class="gateway">

<section aria-labelledby="gatewayTitle" class="entry-panel">
<div class="entry-inner"><nav aria-label="Language / Язык" class="language-switch"><button aria-pressed="true" data-language="en" lang="en" type="button">English</button><button aria-pressed="false" data-language="ru" lang="ru" type="button">Русский</button></nav><a aria-label="Radisson Resort Layan Phuket — Scan and Dine home" class="brand" href="room-order-gateway.html"><img alt="Radisson Resort Layan Phuket" height="1177" src="assets/radisson-logo.png" width="1336"/></a>

<h1 data-i18n="title" id="gatewayTitle">Scan &amp; Dine</h1>


<form id="roomGatewayForm" novalidate="">
<label data-i18n="label" for="roomInput">Room number</label>
<div class="input-wrap"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" viewbox="0 0 24 24"><path d="M5 21h14M7 21V4l10-2v19M11 12h1"></path></svg><input aria-describedby="roomHint gatewayMessage" autocapitalize="characters" autocomplete="off" id="roomInput" inputmode="text" maxlength="12" name="room" placeholder="e.g. A101" spellcheck="false"/></div>
<p class="room-hint" data-i18n="hint" id="roomHint">e.g. A101, D101B</p>
<button class="order-button" disabled="" id="gatewaySubmitBtn" type="submit"><span data-i18n="button">Open menu</span><span aria-hidden="true">→</span></button>
<p aria-live="polite" class="gateway-message" id="gatewayMessage" role="status">Loading room list...</p>
<button class="retry" data-i18n="retry" hidden="" id="retryLoad" type="button">Try again</button>
</form>
<div class="help"><p data-i18n="help">Need help? Please contact Front Desk.</p></div>

</div>
</section>
</main>
<script>
    const ROOM_LINKS_FILE = "room_order_links.json";
    const els = {
      form: document.getElementById("roomGatewayForm"),
      input: document.getElementById("roomInput"),
      btn: document.getElementById("gatewaySubmitBtn"),
      msg: document.getElementById("gatewayMessage"),
    };

    let roomLinks = {};
    let roomKeys = [];
    let ready = false;

    function normalizeRoom(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/-/g, "");
    }

    let language = "en";
    try { if (localStorage.getItem("radisson_dining_language") === "ru") language = "ru"; } catch (_) {}
    let messageState = {key: "loading", type: "", params: {}};
    const UI = {"title": {"en": "Scan &amp; Dine", "ru": "Заказ еды в номер"}, "label": {"en": "Room number", "ru": "Номер комнаты"}, "hint": {"en": "e.g. A101, D101B", "ru": "Например: A101, D101B"}, "button": {"en": "Open menu", "ru": "Открыть меню"}, "retry": {"en": "Try again", "ru": "Попробовать снова"}, "help": {"en": "Need help? Please contact Front Desk.", "ru": "Нужна помощь? Обратитесь на стойку регистрации."}};
    const MESSAGES = {
      loading: {en:"Loading room list...",ru:"Загружаем список номеров..."},
      ready: {en:"",ru:""},
      loadError: {en:"Unable to load rooms. Please try again or contact Front Desk.",ru:"Не удалось загрузить список номеров. Попробуйте снова или обратитесь на стойку регистрации."},
      continue: {en:"",ru:""},
      empty: {en:"Please enter your room number.",ru:"Пожалуйста, введите номер комнаты."},
      notFound: {en:"Room not found. Please check your room number or contact Front Desk.",ru:"Номер не найден. Проверьте номер комнаты или обратитесь на стойку регистрации."},
      ambiguous: {en:"Please include building letter. Matching rooms: {rooms}",ru:"Укажите букву корпуса. Найдены номера: {rooms}"},
      opening: {en:"Opening order page for room {room}...",ru:"Открываем страницу заказа для номера {room}..."}
    };
    function setMessage(key, type = "", params = {}) {
      messageState = {key, type, params};
      els.msg.textContent = MESSAGES[key][language].replace(/\{(\w+)\}/g, (_, name) => params[name] || "");
      els.input.setAttribute("aria-invalid", String(type === "error"));
      els.msg.className = "gateway-message" + (type ? " " + type : "");
    }
    function setLanguage(next) {
      language = next === "ru" ? "ru" : "en";
      document.documentElement.lang = language;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = UI[el.dataset.i18n][language]; });
      document.querySelectorAll("[data-language]").forEach(el => { el.setAttribute("aria-pressed", String(el.dataset.language === language)); });
      els.input.placeholder = language === "ru" ? "Например, A101" : "e.g. A101";
      document.title = (language === "ru" ? "Меню в вашем номере" : "Scan & Dine") + " | Radisson Resort Layan Phuket";
      document.querySelector(".brand").setAttribute("aria-label", language === "ru" ? "Radisson Resort Layan Phuket — Главная" : "Radisson Resort Layan Phuket — Scan and Dine home");
      setMessage(messageState.key, messageState.type, messageState.params);
      try { localStorage.setItem("radisson_dining_language", language); } catch (_) {}
    }
    document.querySelectorAll("[data-language]").forEach(el => { el.addEventListener("click", () => setLanguage(el.dataset.language)); });
    setLanguage(language);

    function findRoom(room) {
      if (roomLinks[room]) return { room, url: roomLinks[room] };

      // Guest enters only 101 / 101B: help if there is exactly one matching room.
      if (/^\d{2,4}[A-Z]?$/.test(room)) {
        const matched = roomKeys.filter((key) => key.endsWith(room));
        if (matched.length === 1) return { room: matched[0], url: roomLinks[matched[0]] };
        if (matched.length > 1) return { ambiguous: true, choices: matched.slice(0, 8) };
      }

      return null;
    }

    async function loadRoomLinks() {
      try {
        const response = await fetch(ROOM_LINKS_FILE + "?v=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("Cannot load " + ROOM_LINKS_FILE);
        roomLinks = await response.json();
        roomKeys = Object.keys(roomLinks).sort();
        ready = true;
        els.btn.disabled = false;
        setMessage("ready");

      } catch (error) {
        console.error(error);
        document.getElementById("retryLoad").hidden = false;
        setMessage("loadError", "error");
      }
    }

    els.input.addEventListener("input", () => {
      const value = normalizeRoom(els.input.value);
      if (els.input.value !== value) els.input.value = value;
      if (ready) setMessage("ready");
    });

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!ready) return;

      const room = normalizeRoom(els.input.value);
      if (!room) {
        setMessage("empty", "error");
        els.input.focus();
        return;
      }

      const found = findRoom(room);
      if (!found) {
        setMessage("notFound", "error");
        return;
      }

      if (found.ambiguous) {
        setMessage("ambiguous", "error", {rooms: found.choices.join(", ")});
        return;
      }

      setMessage("opening", "ok", {room: found.room});
      window.location.assign(found.url);
    });

    document.getElementById("retryLoad").addEventListener("click", () => {
      setMessage("loading");
      document.getElementById("retryLoad").hidden = true;
      loadRoomLinks();
    });

    loadRoomLinks();
  </script>
</body>
</html>
