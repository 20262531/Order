<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c42"><title>ส่งบิล · The Taste Kitchen</title><link rel="stylesheet" href="taste-order.css?v=1"><script src="firebase-config.js"></script><script src="flow-v2/receipt-parser.js?v=tablet-ui-1"></script><script src="ai-config.js?v=tablet-ui-1"></script><script src="ai-client.js?v=tablet-ui-1" defer></script><script src="photo-jobs.js?v=tablet-ui-1" defer></script><script src="photo-outbox.js?v=taste-1" defer></script><script src="photo-flow.js?v=taste-1" defer></script></head><body data-mode="hostess"><header class="masthead">
  <div class="mast-inner">
    <a class="brand" href="hostess.html">THE TASTE <span>ORDER</span></a>
    <nav aria-label="หน้าหลัก"><a href="hostess.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h6"/></svg> ส่งบิล</a><a href="kitchen.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 20v-7a4 4 0 0 1-3-4 4 4 0 0 1 5-4 4 4 0 0 1 6 0 4 4 0 0 1 5 4 4 4 0 0 1-3 4v7zm0-4h10"/></svg> หน้าครัว</a></nav>

    <details class="more"><summary aria-label="เมนูเพิ่มเติม">•••</summary><div><button id="aiSetup">ตั้งค่า AI</button><a href="hostess-classic.html">Amenity / หน้าเดิม</a></div></details>
  </div>
</header>
<main class="host">
  <section class="panel">
    <div class="heading"><h1>ส่งบิลเข้าครัว</h1><span class="connection" id="connection" role="status">กำลังเชื่อมต่อ…</span></div>
    <label class="capture"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg><strong>ถ่ายรูป / เลือกรูปบิล</strong><small>JPG, PNG หรือ WebP · ต่ำกว่า 8 MB</small>
      <input id="camera" disabled type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
    </label>
    <div class="selection"><button id="inspectDraft" type="button" aria-label="ขยายรูปบิลที่เลือก"><img id="preview" alt="รูปบิลที่เลือก" hidden></button><div><strong>รูปพร้อมส่ง</strong><small id="fileName"></small></div><button id="removeDraft" aria-label="ลบรูปที่เลือก">×</button></div>
    <button id="upload" class="primary send" hidden disabled>ส่งเข้าครัว</button>
    <div id="progress" role="status"></div><button id="retry" hidden>ลองส่งรูปเดิมอีกครั้ง</button><button id="next" hidden>ถ่ายบิลถัดไป</button>
  </section>
  <section class="panel queue"><h2>สถานะการส่ง</h2>
    <div class="queue-counts"><div>รอส่ง<b id="waitingCount">–</b></div><div>กำลังส่ง<b id="sendingCount">–</b></div><div>ส่งไม่สำเร็จ<b id="failedCount">–</b></div></div>
    <div id="uploadQueue" aria-live="polite">กำลังตรวจคิวส่งรูป…</div>
    <button id="nextPhoto" disabled type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg> ถ่ายบิลถัดไป</button>
    <a id="kitchenLink" href="kitchen.html" hidden>ดูบิลที่หน้าครัว</a>
  </section>
</main><dialog id="draftPicture" aria-label="รูปบิลที่เลือก"><form method="dialog"><button>ปิดรูปบิล</button></form><img id="draftImage" alt="รูปบิลที่เลือก"></dialog><dialog id="aiSettings"><form id="aiSettingsForm"><div class="dialog-head"><div><h2>เชื่อม AI อ่านบิล</h2></div></div><label>Worker URL<input id="aiEndpoint" type="url" required placeholder="https://kitchen-bill-reader.…workers.dev"></label><p class="meta">ตั้งค่าเพียงครั้งเดียวในเครื่องนี้ พนักงานส่งบิลได้ทันที</p><p id="aiSettingsError" class="error" role="alert"></p><div class="dialog-actions"><button id="aiCancel" type="button">ยกเลิก</button><button class="primary">บันทึกการตั้งค่า</button></div></form></dialog></body></html>
